scanner:
  scanner_version: "1.0.0"
  configuration_version: "1.0.0"
  feature_version: "1.1.0"
  universe_version: "1.0.0"
  top_n: 10

  price:
    min_price: 10.0
    max_price: 50000.0

  liquidity:
    min_volume: 1000.0
    min_average_volume: 5000.0
    relative_volume_threshold: 1.0

  momentum:
    enabled: true

  trend:
    enabled: true
    allowed_trends:
      - "BULLISH"
      - "BEARISH"
      - "NEUTRAL"

  breakout:
    enabled: true

  volatility:
    enabled: true

  scoring:
    momentum_weight: 20.0
    volume_weight: 20.0
    trend_weight: 20.0
    breakout_weight: 15.0
    volatility_weight: 15.0
    liquidity_weight: 10.0
