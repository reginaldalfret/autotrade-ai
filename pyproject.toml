[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobitrade"
version = "0.1.0"
description = "AutoTrade AI is a local-first AI trading research and paper trading platform for NSE Indian equities."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AutoTrade AI Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
]

[project.scripts]
mobitrade = "mobitrade.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]